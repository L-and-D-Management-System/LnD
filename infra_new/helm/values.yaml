global:
  jwtSecret: "secret"
  mongo:
    uri: "mongodb://mongo-svc:27017/lnd"
authService:
  enabled: false
  replicaCount: 2
  
  image:
    repository: chandu554/auth-service-image
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 3001
  
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  
