{{- if .Values.userService.enabled }}
{{- $local := .Values.userService }}
---
apiVersion: v1
kind: Service
metadata:
  name: user-svc
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ $local.service.port }}
      targetPort: {{ $local.service.port }}
  selector:
    {{- include "user-service.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: user-svc-preview
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ $local.service.port }}
      targetPort: {{ $local.service.port }}
  selector:
    {{- include "user-service.labels" . | nindent 4 }}

{{- end }}

