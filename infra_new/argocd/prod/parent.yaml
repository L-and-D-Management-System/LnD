apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-parent-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/L-and-D-Management-System/LnD.git
    path: infra_new/argocd/prod
    targetRevision: HEAD
    directory:
      recurse: true
      exclude: "parent.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
