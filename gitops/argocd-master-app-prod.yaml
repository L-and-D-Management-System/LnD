apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lnd-master-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/L-and-D-Management-System/LnD.git
    targetRevision: HEAD
    path: gitops/apps/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: ld-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      
    syncOptions:
      - CreateNamespace=true
