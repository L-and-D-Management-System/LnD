name: Reusable Manual Release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      service_name:
        required: true
        type: string
      dev_manifest_path:
        required: true
        type: string
      prod_manifest_path:
        required: true
        type: string
    secrets:
      TOKEN:
        required: true

jobs:
  promote-to-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infra Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Promote Image
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEV_MANIFEST: ${{ inputs.dev_manifest_path }}
          PROD_MANIFEST: ${{ inputs.prod_manifest_path }}
        run: |
          # 1. Get the image tag that was tested in Dev
          TESTED_TAG=
          
          if [ "$TESTED_TAG" == "null" ]; then
            echo "Error: No tested image tag found in dev manifest."
            exit 1
          fi

          # 2. Update Prod Manifest with the new Release Tag
          /usr/local/bin/yq -i ".spec.source.helm.parameters |= map(if .name == \"image.tag\" then .value = \"$RELEASE_TAG\" else . end)" "$PROD_MANIFEST"
          /usr/local/bin/yq -i ".metadata.annotations.\"ci.smartparking.io/last-release-sha\" = \"$TESTED_TAG\"" "$PROD_MANIFEST"

          # 3. Commit and Push
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "release: promote ${{ inputs.service_name }} to $RELEASE_TAG"
          git push