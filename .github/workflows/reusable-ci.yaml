name: Reusable Microservice CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      image_name:
        required: true
        type: string
      is_frontend:
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
      SNYK_TOKEN:
        required: true
      GHCR_PAT:
        required: true
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      EMAIL_PASSWORD:
        required: true
      EMAIL_USERNAME:
        required: true

jobs:
  ci-pipeline:
    name: CI Pipeline for ${{ inputs.service_name }}
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # Checkout
      # -------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------------
      # Variables
      # -------------------------------
      - name: Set Variables
        id: vars
        run: |
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "REPO_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      # -------------------------------
      # SonarQube Scan
      # -------------------------------
      - name: Generate Sonar Config
        run: |
          echo "sonar.projectKey=${{ inputs.service_name }}" > sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Sonar Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # -------------------------------
      # Snyk Scan
      # -------------------------------
      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # -------------------------------
      # Docker Setup
      # -------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------
      # Login (GHCR + DockerHub)
      # -------------------------------
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # -------------------------------
      # Build Image
      # -------------------------------
      - name: Build Docker Image
        run: |
          docker build \
          -t ghcr.io/${{ steps.vars.outputs.REPO_LC }}/${{ inputs.image_name }}:${{ steps.vars.outputs.IMAGE_TAG }} \
          -t ghcr.io/${{ steps.vars.outputs.REPO_LC }}/${{ inputs.image_name }}:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ steps.vars.outputs.IMAGE_TAG }} \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:latest .

      # -------------------------------
      # Trivy Scan
      # -------------------------------
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.REPO_LC }}/${{ inputs.image_name }}:${{ steps.vars.outputs.IMAGE_TAG }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      # -------------------------------
      # Push Images
      # -------------------------------
      - name: Push Images
        run: |
          docker push ghcr.io/${{ steps.vars.outputs.REPO_LC }}/${{ inputs.image_name }}:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push ghcr.io/${{ steps.vars.outputs.REPO_LC }}/${{ inputs.image_name }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:latest

      # -------------------------------
      # Email Notification
      # -------------------------------
      - name: Notification Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI Result: ${{ inputs.service_name }} - ${{ job.status }}"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: "L&D DevOps Pipeline"
          body: |
            CI Pipeline for ${{ inputs.service_name }} has ${{ job.status }}.
            Image Tag: ${{ steps.vars.outputs.IMAGE_TAG }}
            Commit: ${{ github.sha }}
            Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
