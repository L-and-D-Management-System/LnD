name: Reusable Microservice CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      image_name:
        required: true
        type: string
      dev_manifest_path:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      SNYK_TOKEN:
        required: true
      TOKEN:
        required: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=L-and-D-Management-System_${{ inputs.service_name }}
            -Dsonar.organization=l-and-d-management-system

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:sha-${{ github.sha }}

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:sha-${{ github.sha }}
          format: 'table'
          exit-code: 1
          severity: 'CRITICAL,HIGH'

      - name: Update Dev Manifest
        shell: bash
        env:
          DEV_MANIFEST: ${{ inputs.dev_manifest_path }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          # Checkout Infra Repo
          git clone https://${{ secrets.TOKEN }}@github.com/L-and-D-Management-System/LnD.git infra
          cd infra
          # Install yq
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq
          # Update Image Tag
          /usr/local/bin/yq -i ".spec.source.helm.parameters |= map(if .name == \"image.tag\" then .value = \"$IMAGE_TAG\" else . end)" "$DEV_MANIFEST"
          # Update Built Annotation
          /usr/local/bin/yq -i ".metadata.annotations.\"ci.smartparking.io/last-built-sha\" = \"$IMAGE_TAG\"" "$DEV_MANIFEST"
          # Push
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "deploy: update ${{ inputs.service_name }} dev image to $IMAGE_TAG"
          git push