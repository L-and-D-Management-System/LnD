name: Reusable Microservice CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      image_name:
        required: true
        type: string
      is_frontend:
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: false
      SNYK_TOKEN:
        required: true
      GHCR_PAT:
        required: true
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      EMAIL_PASSWORD:
        required: true
      EMAIL_USERNAME:
        required: true

jobs:
  ci-pipeline:
    name: CI Pipeline for ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Tag Variables
        id: vars
        run: |
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # --- STEP 1: SAST SCAN (Sonar) ---
      - name: Generate Sonar Config
        run: |
          echo "sonar.projectKey=L-and-D-Management-System_auth-service_0f22a64f-770d-47af-ba80-436796307ac6" > sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # --- STEP 2: QUALITY GATE ---
      - name: Sonar Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # --- STEP 3: SNYK SCAN ---
      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true # Allow build to continue but log vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # --- STEP 4: IMAGE BUILDING ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registries
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/l-and-d-management-system/${{ inputs.image_name }}:${{ steps.vars.outputs.IMAGE_TAG }} \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ steps.vars.outputs.IMAGE_TAG }} \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:latest .

      # --- STEP 5: TRIVY SCAN ---
      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ steps.vars.outputs.IMAGE_TAG }}
          format: 'table'
          exit-code: 0
          severity: 'CRITICAL,HIGH'

      # --- STEP 6: IMAGE PUSHING ---
      - name: Push to Registries
        if: success()
        run: |
          docker push ghcr.io/l-and-d-management-system/${{ inputs.image_name }}:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:latest

      # --- STEP 7: SMTP NOTIFICATION ---
      - name: Notification Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI Result: ${{ inputs.service_name }} - ${{ job.status }}"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: "L&D DevOps Pipeline"
          body: |
            CI Pipeline for ${{ inputs.service_name }} has ${{ job.status }}.
            Environment: ${{ github.ref_name }}
            Image Tag: ${{ steps.vars.outputs.IMAGE_TAG }}
            Commit: ${{ github.sha }}
            View Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
